[package]
name = "weftforge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
earcutr.workspace = true
sha2 = "=0.10.9"
tempfile = "=3.27.0"
quick-xml = "=0.41.0"
png = "=0.18.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"] }
weftforge-sim = { path = "../weftforge-sim" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[dev-dependencies]
tobj.workspace = true
